name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from UI

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r automation_playwright/requirements.txt

    - name: Ensure browsers are installed
      run: python -m playwright install --with-deps

    - name: Run Playwright tests
      working-directory: ./automation_playwright
      run: pytest --html=report.html --self-contained-html

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: always() # Upload report regardless of pass/fail
      with:
        name: playwright-test-report
        path: automation_playwright/report.html
        retention-days: 14
